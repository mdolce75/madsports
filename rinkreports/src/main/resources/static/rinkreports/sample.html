<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Informes de ejemplo · RinkReports</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232fd3a0'/%3E%3Crect x='13' y='11' width='38' height='42' rx='3' fill='%23fff'/%3E%3Cpath d='M19 21H36M19 29H36M19 37H36M41 21H45M41 29H45M41 37H45' stroke='%2308130f' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M19 45H45' stroke='%2308130f' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/reports.css">
</head>
<body data-product="reports" data-section="samples">
<div class="wrap">
    <div class="topbar">
        <div id="brand"></div>
        <div class="userbar" id="userbar">
            <a class="btn ghost" href="/rinkreports/login.html?returnTo=%2Frinkreports">Ingresar</a>
        </div>
    </div>

    <section class="hero">
        <span class="tag">Informes de ejemplo</span>
        <h1>Así se ve<br><em>un informe.</em></h1>
        <p class="lead">Con datos ficticios ("Club Ejemplo", "Tomás Ejemplo"), para que conozcas el formato. Exportalo a
            PDF o a Excel como cualquier informe.</p>
        <nav class="rr-tabs" aria-label="Tipo de informe">
            <a href="?kind=club" data-kind="club">Club</a>
            <a href="?kind=player" data-kind="player">Jugador</a>
        </nav>
    </section>

    <div id="visor" hidden></div>

    <footer>© 2026 RinkReports · Un producto de <a href="/madsports">Mad Sports</a>.</footer>
</div>

<script src="/js/app.js"></script>
<script src="/js/reports.js"></script>
<script>
    rrSessionBar();
    const kind = new URLSearchParams(location.search).get("kind") === "player" ? "player" : "club";
    document.querySelector(`.rr-tabs [data-kind="${kind}"]`).setAttribute("aria-current", "page");
    const base = kind === "player" ? "/api/sample-player" : "/api/sample";
    rrShowReport($("visor"), {htmlUrl: base + ".html", pdfUrl: base + ".pdf", xlsxUrl: base + ".xlsx"},
        kind === "player" ? "Informe de jugador · Tomás Ejemplo" : "Informe de club · Club Ejemplo");
</script>
</body>
</html>

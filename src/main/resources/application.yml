spring:
  application:
    name: rink-metrics
  # Secretos locales (SMTP, Gemini...) en un .env junto a la app, fuera de git. En producción, variables de entorno.
  config:
    import: optional:file:.env[.properties]
  thymeleaf:
    cache: true
  # Usuarios: H2 en archivo (./data). En producción, FPP_DB_URL apunta a la base que corresponda.
  datasource:
    url: ${FPP_DB_URL:jdbc:h2:file:./data/rink-metrics}
    username: ${FPP_DB_USER:sa}
    password: ${FPP_DB_PASSWORD:}
  # Mails (confirmar email, recuperar clave) por SMTP: Resend, Brevo, Gmail... Sin SMTP_HOST, se escriben en el log.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo crea Flyway (db/migration)
  web:
    resources:
      cache:
        # Los archivos del jar tienen fecha fija (1980, build reproducible): validar por fecha haría que el navegador
        # se quede con versiones viejas. Sin Last-Modified y con no-cache, cada visita baja la versión actual.
        use-last-modified: false
        cachecontrol:
          no-cache: true   # la web se revalida en cada visita: los cambios se ven sin limpiar cache

server:
  port: ${PORT:8080}

rinkmetrics:
  mail:
    from: ${MAIL_FROM:RinkMetrics <info@madsportsapp.com>}
    # Dirección pública de la web, para armar los enlaces de los mails
    base-url: ${APP_BASE_URL:http://localhost:8080}
  sidgad:
    base-url: https://www.server2.sidgad.es/cap/
    origin: https://www.buenosaires.sidgad.com
    # Pedidos en paralelo, sin sobrecargar el sitio: hasta 6 a la vez y como mucho 10 por segundo
    max-concurrency: 6
    min-interval: 100ms
    data-ttl: 15m
    catalog-ttl: 6h
    timeout: 20s
    # Federaciones (FPP, AMP) y sus categorías relevadas: ver Federacion (de Infantil para arriba)
    # Años que se ofrecen; si SIDGAD todavía no tiene un año, la web lo informa
    years: [2026, 2027]
  # Análisis con Google Gemini (plan gratuito de Google AI Studio). Sin API key: análisis por reglas.
  ai:
    enabled: ${FPP_AI_ENABLED:true}
    api-key: ${GEMINI_API_KEY:}
    model: ${FPP_AI_MODEL:gemini-3.8-flash}
    base-url: https://generativelanguage.googleapis.com/v1beta
    timeout: 120s

# Precios en pesos: el precio base de los planes está en dólares y se convierte con el dólar oficial del BNA
# (venta) del día. Si DolarAPI no responde se usa la última cotización conocida o, si nunca respondió, el respaldo.
rinkmetrics:
  dolar:
    url: ${DOLAR_URL:https://dolarapi.com/v1/dolares/oficial}
    respaldo: ${DOLAR_RESPALDO:1500}

# Tests: base de usuarios en memoria (no se crea ./data). Para correr todo contra PostgreSQL en Docker:
#   ./mvnw test -Drinkmetrics.test.db=jdbc:tc:postgresql:16-alpine:///rinkmetrics
spring.datasource.url=${rinkmetrics.test.db:jdbc:h2:mem:rink-metrics;DB_CLOSE_DELAY=-1}
# Tests: nunca mandar mails de verdad aunque haya un .env con SMTP
spring.mail.host=
# Tests: tipo de cambio fijo (sin consultar DolarAPI)
rinkmetrics.dolar.url=
rinkmetrics.dolar.respaldo=1500
# Tests: el alta de Club y Jugador abierta (en la app está cerrada hasta que Informes esté disponible)
rinkmetrics.registro.informes=true
# Tests: los límites de intentos no cortan las suites (que registran e ingresan muchas veces desde la misma IP);
# LimiteIntentosTest los prueba con valores bajos.
rinkmetrics.limites.login-usuario=1000
rinkmetrics.limites.login-ip=1000
rinkmetrics.limites.registro-ip=1000
rinkmetrics.limites.mails-ip=1000

<script>
var $j = jQuery.noConflict();
	$j(document).ready(function() {	
	
		$j(".listado_competiciones_fila").hide();
		var scorer_file = 'https://www.server2.sidgad.es/cap/cap_ls_1.php';
		var temp = $j("#temp_activa").val();
	$j('#listado_competiciones').load(scorer_file,
		function( response, status, xhr ) {
			if (status == 'success') {
			  	$j(".listado_competiciones_fila").hide();
			  	
			  	$j(".temp_"+temp).show();
			  	$j(".id_fede_2").hide();
				$j(".id_fede_1").hide();
				$j(".id_fede_4").hide();
				$j(".id_fede_5").hide();
				setInterval(function(){
				  	$j(".id_fede_2").hide();
				  	$j(".id_fede_1").hide();
				  	$j(".id_fede_4").hide();
				  	$j(".id_fede_5").hide();
				  	},30000);

			}
		}	
	);
	
		$j(document).on("click",".select_temporada",function(e){	
	
			e.preventDefault();
	
			setTimeout(function(){
				  	$j(".id_fede_2").hide();
				  	$j(".id_fede_1").hide();
				  	$j(".id_fede_4").hide();
				  	$j(".id_fede_5").hide();
				},1000);
	});
	
	});

</script>

# CI de RinkMetrics, en cada PR y en cada push a main:
# - Backend: tests unitarios (*Test, H2 en memoria), de integración (*IT, PostgreSQL real con Testcontainers) y
#   cobertura de JaCoCo.
# - Pantallas (frontend/): lint, tipos, tests de React y de los módulos de Métricas DT (con el contrato de la API contra
#   la demo), build, auditoría de dependencias y E2E de la demo con Playwright.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Solo lectura: el pipeline no publica nada ni escribe en el repositorio.
permissions:
  contents: read

# Un push nuevo a la misma rama/PR cancela la corrida anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Construye Métricas DT en React (el plugin baja su propio Node) + unitarios (*Test) + integración (*IT,
      # PostgreSQL 16 con Testcontainers; Docker ya está disponible en el runner) + reporte de cobertura de JaCoCo.
      - name: Build y tests
        run: ./mvnw -B -ntp verify

      - name: Resumen de cobertura
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          [ -f "$csv" ] || exit 0
          awk -F, 'NR > 1 { lm += $8; lc += $9; bm += $6; bc += $7 }
            END { printf "### Cobertura\n\n| Líneas | Ramas |\n|---|---|\n| %.1f %% | %.1f %% |\n",
                  100 * lc / (lc + lm), 100 * bc / (bc + bm) }' "$csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: target/site/jacoco
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar reportes de tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-tests
          path: |
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 14

  pantallas:
    name: Pantallas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      # Componentes de React (Vitest + Testing Library), módulos de js/dt y el contrato de la API contra la demo.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Solo dependencias que llegan al navegador; falla con vulnerabilidades altas o críticas.
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high

      # La demo en un navegador real (celular y escritorio): la pantalla actual y la versión en React.
      - name: E2E con Playwright
        env:
          E2E_BROWSER_CHANNEL: chromium
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Publicar reportes de E2E
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reportes
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

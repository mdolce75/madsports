# Tests unitarios (*Test): base en memoria H2 (no se crea ./data). Los de integración (*IT) usan PostgreSQL en Docker.
spring.datasource.url=jdbc:h2:mem:madsports;DB_CLOSE_DELAY=-1
# Tests: nunca mandar mails de verdad aunque haya un .env con SMTP
spring.mail.host=
# Tests: tipo de cambio fijo (sin consultar DolarAPI)
madsports.dollar.url=
madsports.dollar.fallback=1500
# Tests: el alta de clubes y los planes pagos del jugador habilitados (en la app, cerrados por ahora); ReportsSignupTest
# prueba los valores de la app.
madsports.signup.club=true
madsports.signup.player-paid=true
madsports.signup.player-amp=true
# Tests: los límites de intentos no cortan las suites (que registran e ingresan muchas veces desde la misma IP);
# AttemptLimiterTest los prueba con valores bajos.
madsports.limits.login-user=1000
madsports.limits.login-ip=1000
madsports.limits.signup-ip=1000
madsports.limits.mails-ip=1000

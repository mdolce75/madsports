spring:
  application:
    name: madsports
  # Secretos locales (SMTP, Gemini...) en un .env junto a la app, fuera de git. En producción, variables de entorno.
  config:
    import: optional:file:.env[.properties]
  thymeleaf:
    cache: true
  # Usuarios: H2 en archivo (./data). En producción, MADSPORTS_DB_URL apunta a la base que corresponda (las variables
  # de antes, FPP_DB_*, siguen valiendo).
  datasource:
    url: ${MADSPORTS_DB_URL:${FPP_DB_URL:jdbc:h2:file:./data/madsports}}
    username: ${MADSPORTS_DB_USER:${FPP_DB_USER:sa}}
    password: ${MADSPORTS_DB_PASSWORD:${FPP_DB_PASSWORD:}}
  # Mails (confirmar email, recuperar clave) por SMTP: Resend, Brevo, Gmail... Sin SMTP_HOST, se escriben en el log.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
  # Migraciones por motor: db/migration/h2 (desarrollo) y db/migration/postgresql (producción). Flyway elige la carpeta
  # según la base a la que se conecta.
  flyway:
    locations: classpath:db/migration/{vendor}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo crea Flyway (db/migration/{vendor})
  web:
    resources:
      cache:
        # Los archivos del jar tienen fecha fija (1980, build reproducible): validar por fecha haría que el navegador
        # se quede con versiones viejas. Sin Last-Modified y con no-cache, cada visita baja la versión actual.
        use-last-modified: false
        cachecontrol:
          no-cache: true   # la web se revalida en cada visita: los cambios se ven sin limpiar cache

server:
  port: ${PORT:8080}
  # Detrás del proxy del proveedor (Render, Railway...), "native" toma la IP real del cliente de X-Forwarded-For: la
  # usan los límites de intentos. Sin proxy, "none" (un cliente no puede falsear su IP).
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      # Sesión sin actividad: 8 h (por defecto eran 30 min). Con "Recordarme", al vencer se vuelve a entrar solo.
      timeout: ${SESSION_TIMEOUT:8h}

# Configuración de la app. Las variables de entorno de antes (en castellano) siguen valiendo como respaldo.
madsports:
  mail:
    from: ${MAIL_FROM:RinkMetrics <info@madsportsapp.com>}
    # Dirección pública de la web, para armar los enlaces de los mails
    base-url: ${APP_BASE_URL:http://localhost:8080}
  sidgad:
    base-url: https://www.server2.sidgad.es/cap/
    origin: https://www.buenosaires.sidgad.com
    # Pedidos en paralelo, sin sobrecargar el sitio: hasta 6 a la vez y como mucho 10 por segundo
    max-concurrency: 6
    min-interval: 100ms
    # El informe del club completo (lee las actas de todas sus categorías) usa 3 veces eso: hasta 18 a la vez y 30
    # por segundo, en su propio cupo.
    club-factor: 3
    data-ttl: 15m
    catalog-ttl: 6h
    timeout: 20s
    # Federaciones (FPP, AMP) y sus categorías relevadas: ver Federation (de Infantil para arriba)
    # Años que se ofrecen; si SIDGAD todavía no tiene un año, la web lo informa
    years: [2026, 2027]
  # Análisis con Google Gemini (plan gratuito de Google AI Studio). Sin API key: análisis por reglas.
  ai:
    enabled: ${AI_ENABLED:${FPP_AI_ENABLED:true}}
    api-key: ${GEMINI_API_KEY:}
    model: ${AI_MODEL:${FPP_AI_MODEL:gemini-3.8-flash}}
    base-url: https://generativelanguage.googleapis.com/v1beta
    timeout: 120s
  # Alta de cuentas: abierta para jugadores y clubes (RinkReports) y DT (RinkMetrics). Todos empiezan con su plan free
  # (hasta el 31/12/2026): los mensuales (pagos) figuran como "Próximamente" hasta que se habilite el cobro; los de
  # RinkReports, además, con "Precio a definir".
  signup:
    club: ${SIGNUP_CLUB:${REGISTRO_CLUB:true}}
    club-paid: ${SIGNUP_CLUB_PAID:${REGISTRO_CLUB_PAGO:false}}
    coach-paid: ${SIGNUP_COACH_PAID:${REGISTRO_DT_PAGO:false}}
    player-paid: ${SIGNUP_PLAYER_PAID:${REGISTRO_JUGADOR_PAGO:false}}
    # La AMP (Mendoza), oculta hasta nuevo aviso: el registro no la ofrece y no se crean cuentas nuevas de la AMP.
    amp: ${SIGNUP_AMP:false}
    # Jugadores de la AMP: próximamente (por ahora, solo de la FPP).
    player-amp: ${SIGNUP_PLAYER_AMP:${REGISTRO_JUGADOR_AMP:false}}
  # Límite de intentos (AttemptLimiter): ingresos fallidos por usuario y por IP en 15 minutos; altas de cuenta y pedidos
  # de mails por IP en 1 hora. Al llegar al máximo, la API responde 429 hasta que vence la ventana.
  limits:
    login-user: ${LIMIT_LOGIN_USER:${LIMITE_LOGIN_USUARIO:5}}
    login-ip: ${LIMIT_LOGIN_IP:${LIMITE_LOGIN_IP:20}}
    signup-ip: ${LIMIT_SIGNUP_IP:${LIMITE_REGISTRO_IP:5}}
    mails-ip: ${LIMIT_MAILS_IP:${LIMITE_MAILS_IP:10}}
  # "Recordarme" en el ingreso: dura 30 días en el dispositivo. La clave firma la sesión que arma (si falta, se genera
  # una al arrancar; los dispositivos recordados siguen valiendo porque el token está en la base).
  remember-me:
    key: ${REMEMBER_ME_KEY:${RECORDARME_CLAVE:}}
    days: ${REMEMBER_ME_DAYS:${RECORDARME_DIAS:30}}
  # Precios en pesos: el precio base de los planes está en dólares y se convierte con el dólar oficial del BNA
  # (venta) del día. Si DolarAPI no responde se usa la última cotización conocida o, si nunca respondió, el respaldo.
  dollar:
    url: ${DOLLAR_URL:${DOLAR_URL:https://dolarapi.com/v1/dolares/oficial}}
    fallback: ${DOLLAR_FALLBACK:${DOLAR_RESPALDO:1500}}
  # Chequeo diario de SIDGAD (SidgadMonitor): recorre portal, catálogo, calendario y acta; el resultado queda en
  # /actuator/health (componente "sidgad") y, si falla o se recupera, se avisa por mail a ALERTS_EMAIL (vacío = solo log).
  # El cron se evalúa en hora argentina; "-" lo apaga.
  monitor:
    cron: ${SIDGAD_MONITOR_CRON:${MONITOR_SIDGAD_CRON:0 0 8 * * *}}
  alerts:
    email: ${ALERTS_EMAIL:${ALERTAS_EMAIL:}}

# Health check público en /actuator/health: solo el estado general y el de cada componente (db, sidgad...), sin
# detalles. Para la sonda de vida de la plataforma usar /actuator/health/liveness, que no depende de SIDGAD ni de la base.
# El SMTP no se chequea: abriría una conexión al proveedor de mails en cada consulta del health.
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      show-details: never
      probes:
        enabled: true

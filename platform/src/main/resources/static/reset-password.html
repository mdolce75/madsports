<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clave nueva · RinkMetrics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='64' height='64' rx='14' fill='%2322b8f0'/%3E%3Crect x='8' y='15' width='48' height='34' rx='14' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Crect x='20' y='33' width='6' height='9' rx='1.5' fill='%23fff'/%3E%3Crect x='29' y='27' width='6' height='15' rx='1.5' fill='%23fff'/%3E%3Crect x='38' y='21' width='6' height='21' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/reports.css">
</head>
<body>
<script>
    // Página compartida por los dos productos: con ?product=reports, la marca y la paleta de RinkReports.
    if (new URLSearchParams(location.search).get("product") === "reports") document.body.dataset.product = "reports";
</script>
<div class="wrap">
    <div id="brand"></div>

    <div class="split">
    <div class="intro">
    <section class="hero">
        <span class="tag">Recuperar clave</span>
        <h1>Tu clave<br><em>nueva.</em></h1>
        <p class="lead">Definí una nueva clave para tu cuenta de RinkMetrics.</p>
    </section>
    </div>
    <div class="main">
    <form class="sheet" id="form" novalidate>
        <div class="sheet-head"><span>Clave nueva</span><span></span></div>
        <div class="field">
            <label for="clave">Clave nueva</label>
            <input type="password" id="clave" autocomplete="new-password" required minlength="8" maxlength="72" autofocus>
        </div>
        <div class="field">
            <label for="clave2">Repetí la clave</label>
            <input type="password" id="clave2" autocomplete="new-password" required minlength="8" maxlength="72">
        </div>
        <button class="go" id="go" type="submit">Guardar clave</button>
        <div id="status" role="status" aria-live="polite"></div>
        <p class="alt"><a href="/forgot-password.html">Pedir otro enlace</a> · <a href="/rinkmetrics/login.html">Ingresar</a></p>
    </form>
    </div>
    </div>

    <footer>© 2026 RinkMetrics. Todos los derechos reservados.</footer>
</div>

<script src="/js/app.js"></script>
<script>
    $("brand").outerHTML = brand();
    // Los enlaces y el pedido son del producto de la página.
    const withProduct = url => product() === "REPORTS" ? url + (url.includes("?") ? "&" : "?") + "producto=reports" : url;
    document.querySelectorAll('a[href="/rinkmetrics/login.html"]').forEach(a => { a.href = login(); });
    document.querySelectorAll('a[href="/forgot-password.html"]').forEach(a => { a.href = withProduct("/forgot-password.html"); });
    document.querySelectorAll("footer").forEach(f => {
        f.textContent = `© 2026 ${product() === "REPORTS" ? "RinkReports" : "RinkMetrics"} · Un producto de Mad Sports.`;
    });
    session();   // deja la cookie CSRF
    const token = new URLSearchParams(location.search).get("token") || "";
    if (!token) status("Falta el enlace: abrí esta página desde el mail que te mandamos.", true);
    $("form").addEventListener("submit", async ev => {
        ev.preventDefault();
        const password = $("clave").value;
        if (password.length < 8) {
            status("La clave lleva al menos 8 caracteres.", true);
            return;
        }
        if (password !== $("clave2").value) {
            status("Las dos claves no coinciden.", true);
            return;
        }
        $("go").disabled = true;
        try {
            await postJson("/api/password/reset", {token, password});
            location.replace(login() + "?password=changed");
        } catch (e) {
            status(e.message, true);
            $("go").disabled = false;
        }
    });
</script>
</body>
</html>

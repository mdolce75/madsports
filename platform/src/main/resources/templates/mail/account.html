<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title th:text="${m.subject}">RinkMetrics</title>
</head>
<!--/* Mail con la identidad de la web: azul noche, acento naranja, tipografía condensada para los títulos.
       Tablas y estilos en línea: es lo que respetan Gmail, Outlook y los clientes de celular. */-->
<body style="margin:0; padding:0; background:#e6ecef;">
<div style="display:none; max-height:0; overflow:hidden; opacity:0;" th:text="${m.preheader}">Resumen</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#e6ecef;">
    <tr>
        <td align="center" style="padding:28px 12px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
                <!-- Marca -->
                <tr>
                    <td style="padding:0 0 18px 0;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td style="padding-right:12px;" valign="middle">
                                    <img src="cid:logo" width="44" height="44" alt="RinkMetrics" th:alt="${m.product.displayName()}" style="display:block; border:0; border-radius:10px;">
                                </td>
                                <td valign="middle" style="font-family:'Oswald','Arial Narrow',Arial,sans-serif;">
                                    <div style="font-size:20px; font-weight:bold; letter-spacing:2px; color:#0f1d23; text-transform:uppercase;" th:text="${m.product.displayName()}">RinkMetrics</div>
                                    <div style="font-size:11px; font-weight:bold; letter-spacing:3px; color:#5b6b73; text-transform:uppercase;" th:text="${m.product.tagline()}">Hockey sobre patines</div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <!-- Planilla -->
                <tr>
                    <td style="background:#ffffff; border:1px solid #cfd8dc; padding:26px 26px 28px 26px;" th:styleappend="|border-left:5px solid #${m.product.color()};|">
                        <div style="display:inline-block; color:#ffffff; font-family:'Oswald','Arial Narrow',Arial,sans-serif; font-size:12px; font-weight:bold; letter-spacing:2px; text-transform:uppercase; padding:4px 10px;" th:styleappend="|background:#${m.product.color()};|"
                             th:text="${m.tag}">Cuenta</div>
                        <h1 style="margin:14px 0 12px 0; font-family:'Oswald','Arial Narrow',Arial,sans-serif; font-size:28px; line-height:1.1; color:#0f1d23; text-transform:uppercase; letter-spacing:1px;"
                            th:text="${m.title}">Título</h1>
                        <p style="margin:0 0 12px 0; font-family:Arial,Helvetica,sans-serif; font-size:16px; line-height:1.55; color:#0f1d23;"
                           th:text="|Hola ${m.greeting}:|">Hola:</p>
                        <p th:each="par : ${m.paragraphs}" style="margin:0 0 12px 0; font-family:Arial,Helvetica,sans-serif; font-size:15px; line-height:1.55; color:#3f3f46;"
                           th:text="${par}">Texto</p>
                        <!-- Botón -->
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:22px 0 18px 0;">
                            <tr>
                                <td th:styleappend="|background:#${m.product.color()};|">
                                    <a th:href="${m.url}" href="#" target="_blank"
                                       style="display:inline-block; padding:14px 26px; font-family:'Oswald','Arial Narrow',Arial,sans-serif; font-size:17px; font-weight:bold; letter-spacing:2px; text-transform:uppercase; color:#ffffff; text-decoration:none;"
                                       th:text="|${m.button} ►|">Botón</a>
                                </td>
                            </tr>
                        </table>
                        <p style="margin:0 0 6px 0; font-family:Arial,Helvetica,sans-serif; font-size:13px; line-height:1.5; color:#5b6b73;"
                           th:text="${m.note}">Nota</p>
                        <p style="margin:14px 0 0 0; font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:1.5; color:#5b6b73;">
                            Si el botón no funciona, copiá este enlace en el navegador:<br>
                            <a th:href="${m.url}" th:text="${m.url}" href="#" style="word-break:break-all;" th:styleappend="|color:#${m.product.color()};|">enlace</a>
                        </p>
                    </td>
                </tr>
                <!-- Pie -->
                <tr>
                    <td style="padding:18px 4px 0 4px; font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:1.5; color:#5b6b73;">
                        <span th:text="|© 2026 ${m.product.displayName()} · Un producto de Mad Sports.|">© 2026 RinkMetrics · Un producto de Mad Sports.</span>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
